# Адрес Nexus, из которого сборка берёт Avro-схемы (артефакт avros) и куда их публикует.
# Порт - NEXUS_PORT из .env; если он другой, переопределите: -PnexusUrl=http://localhost:<порт>
# или ORG_GRADLE_PROJECT_nexusUrl. Внутри docker build адрес передаётся аргументом NEXUS_URL.
nexusUrl=http://localhost:8091
