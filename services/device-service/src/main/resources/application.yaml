# Общие настройки. Подключения, тайм-ауты и адреса - только из переменных окружения;
# значения для запуска из IDE и для стенда - в .env.example (Compose передаёт их без значений по умолчанию)
spring:
  application:
    name: device-service
  data:
    redis:
      # Redis общий для платформы: кэш устройства. Адрес - в профиле docker (Sentinel) или локально
      timeout: ${REDIS_TIMEOUT}
      password: ${REDIS_PASSWORD:}
  # Логическая база devices_read в ShardingSphere-Proxy (реплики шардов). Тайм-ауты соединения - в URL
  datasource:
    url: ${DEVICES_READ_DB_URL}
    username: ${DEVICES_READ_DB_USER}
    password: ${DEVICES_READ_DB_PASSWORD}
    hikari:
      pool-name: devices-read
      # Срок ожидания соединения из пула (мс): по истечении запрос чтения получит 503 READ_MODEL_UNAVAILABLE
      connection-timeout: ${DEVICES_READ_DB_POOL_CONNECTION_TIMEOUT_MS}
      # Не падать при старте, если Proxy ещё не готов (отрицательное значение): запрос вернёт 503 READ_MODEL_UNAVAILABLE
      initialization-fail-timeout: ${DEVICES_READ_DB_INIT_FAIL_TIMEOUT_MS}
  # Команды в тему devices (ADR-0001). Версия схемы - явная (avros 1.3.0), автоматическая регистрация выключена
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      # Подтверждение всех реплик и идемпотентность: повтор отправки не даёт второй записи в теме
      acks: all
      properties:
        auto.register.schemas: false
        enable.idempotence: true
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
    template:
      observation-enabled: true

server:
  port: 8080
  shutdown: graceful

app:
  # Пусто или не задано -> hostname контейнера
  instance-id: ${APP_INSTANCE_ID:${HOSTNAME:local}}
  # Сервисные токены Keycloak (FR-009): iss - KEYCLOAK_ISSUER_URI, ключи - KEYCLOAK_JWK_SET_URI (внутренний адрес)
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
    audience: ${DEVICE_SERVICE_AUDIENCE}
    clock-skew: ${JWT_CLOCK_SKEW}
    jwk-connect-timeout: ${KEYCLOAK_JWK_CONNECT_TIMEOUT}
    jwk-read-timeout: ${KEYCLOAK_JWK_READ_TIMEOUT}
  cache:
    # Срок жизни кэша устройства (ключ device:v1:{deviceId})
    device-ttl: ${DEVICE_CACHE_TTL}
    # Срок жизни порога версии (ключ device:v1:floor:{deviceId}); его же задаёт device-collector-service.
    # Больше device-ttl: порог должен пережить истечение кэша, пока реплика не догонит применённую версию (ADR-0003)
    floor-ttl: ${DEVICE_CACHE_FLOOR_TTL}
  commands:
    # Тема команд - та же, что у device-collector-service (KAFKA_DEVICES_TOPIC)
    devices-topic: ${KAFKA_DEVICES_TOPIC}
    # Срок ожидания подтверждения Kafka; по истечении - 503 COMMAND_NOT_ACCEPTED
    send-timeout: ${DEVICE_COMMAND_SEND_TIMEOUT}

# Только технические точки: health (liveness/readiness), metrics, prometheus. Отдаются на отдельном порту без токена;
# порт в контейнере не публикуется на хост (healthcheck и Prometheus ходят по сети Compose)
management:
  server:
    port: ${DEVICE_SERVICE_MANAGEMENT_PORT}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Статус каждого компонента без подробностей
      show-components: always
  metrics:
    tags:
      service: ${spring.application.name}
      instance_id: ${app.instance-id}
    distribution:
      # Гистограммы (_bucket) для p95/p99 на панели Grafana: запросы API и публикация команд
      percentiles-histogram:
        http.server.requests: true
        device.command.publish: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.instance.id: ${app.instance-id}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_ENDPOINT}
  # Метрики отдаются только через /actuator/prometheus, логи - в stdout (их собирает Alloy)
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

# Формат (logstash JSON) задан в logback-spring.xml; здесь - дополнительные поля
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
        instanceId: ${app.instance-id}
