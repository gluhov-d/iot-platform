# Общие настройки. Все подключения - только из переменных окружения;
# значения по умолчанию заданы в application-local.yml / application-docker.yml
spring:
  application:
    name: events-collector-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:events-collector}
      auto-offset-reset: earliest
      # Offset подтверждается вручную и только после записи в ClickHouse
      enable-auto-commit: false
      # Строго по одному сообщению за poll
      max-poll-records: 1
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # Обёртка сохраняет сырые байты до разбора (x-raw-key, x-raw-value); делегаты - ниже
        spring.deserializer.key.delegate.class: com.github.gluhov.iotplatform.eventscollector.config.RawKeepingDeserializer
        spring.deserializer.value.delegate.class: com.github.gluhov.iotplatform.eventscollector.config.RawKeepingDeserializer
        raw.key.delegate.class: com.github.gluhov.iotplatform.eventscollector.config.StrictUtf8StringDeserializer
        raw.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        # SpecificRecord (сгенерированный DeviceEvent), а не GenericRecord
        specific.avro.reader: true
        # Читаем только DeviceEvent: запись другого типа (даже с настоящим schemaId из Schema Registry) не десериализуется
        # и уходит в failed-events исходными байтами. Без этого её отдали бы listener как есть: ошибка приведения типа
        specific.avro.value.type: com.github.gluhov.iotplatform.events.avro.DeviceEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        # Схемы регистрирует только задача schema-register (avros); продюсер лишь ищет схему в Schema Registry.
        # Незарегистрированная схема - ошибка сериализации, а не молчаливая новая версия
        auto.register.schemas: false
        enable.idempotence: true
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:15000}
    listener:
      type: single
      ack-mode: manual_immediate
      observation-enabled: true
    template:
      observation-enabled: true

  datasource:
    url: ${CLICKHOUSE_URL}/${CLICKHOUSE_DATABASE}
    username: ${CLICKHOUSE_USERNAME}
    password: ${CLICKHOUSE_PASSWORD}
    driver-class-name: com.clickhouse.jdbc.Driver
    hikari:
      pool-name: clickhouse
      maximum-pool-size: ${CLICKHOUSE_POOL_SIZE:5}
      # Сколько ждать свободное соединение из пула, мс
      connection-timeout: ${CLICKHOUSE_CONNECTION_TIMEOUT_MS:30000}
      # Не падать при старте, если ClickHouse еще не готов: запросы повторит обработчик ошибок
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

app:
  # Пусто или не задано -> hostname контейнера
    instance-id: ${APP_INSTANCE_ID:${HOSTNAME:local}}
    kafka:
      events-topic: ${KAFKA_EVENTS_TOPIC:events}
      devices-topic: ${KAFKA_DEVICES_TOPIC:devices}
      failed-events-topic: ${KAFKA_FAILED_EVENTS_TOPIC}
      send-timeout: ${KAFKA_SEND_TIMEOUT:20s}
      # Публикация в failed-events: синхронная, с тайм-аутом; продюсер ошибок - свои max.block/request/delivery
      failed-events-publish-timeout: ${FAILED_EVENTS_PUBLISH_TIMEOUT}
      failed-events-max-block-ms: ${FAILED_EVENTS_MAX_BLOCK_MS}
      failed-events-request-timeout-ms: ${FAILED_EVENTS_REQUEST_TIMEOUT_MS}
      failed-events-delivery-timeout-ms: ${FAILED_EVENTS_DELIVERY_TIMEOUT_MS}
    outbox:
      batch-size: ${OUTBOX_BATCH_SIZE:100}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      lease-ttl-ms: ${OUTBOX_LEASE_TTL_MS:30000}
      publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:2000}
    processing:
      # Ошибка записи в ClickHouse: 3 попытки с паузами 1 с и 2 с, затем failed-events
      max-attempts: ${EVENTS_MAX_ATTEMPTS:3}
      retry-interval: ${EVENTS_RETRY_INTERVAL:1s}
      retry-multiplier: ${EVENTS_RETRY_MULTIPLIER:2.0}

# Только технические точки: health, metrics, prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    # Не "instance": эту метку Prometheus ставит сам (адрес цели)
    tags:
      service: ${spring.application.name}
      instance_id: ${app.instance-id}
    # Бакеты гистограммы для панели p95 времени обработки сообщения в Grafana
    distribution:
      percentiles-histogram:
        spring.kafka.listener: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.instance.id: ${app.instance-id}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  # Метрики отдаются только через /actuator/prometheus, логи - в stdout (их собирает Alloy)
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

# Формат (logstash JSON) задан в logback-spring.xml; здесь - дополнительные поля
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
        instanceId: ${app.instance-id}
  level:
    root: INFO
    org.apache.kafka: WARN
    io.confluent: WARN
    com.clickhouse: WARN
