# Интеграционные тесты: адреса контейнеров приходят из @DynamicPropertySource (AbstractItTest).
# Повторы при ошибке хранилища - с короткой паузой, чтобы сценарий с остановленным шардом шёл секунды
spring:
  data:
    redis:
      timeout: 2s
  kafka:
    consumer:
      properties:
        # Раздел, добавленный к теме у работающей группы, потребитель замечает при обновлении метаданных:
        # в тестах - за секунды (R16), а не за 5 минут
        metadata.max.age.ms: 1000
app:
  instance-id: it
  cache:
    floor-ttl: 24h
  processing:
    retry-interval: 200ms

management:
  tracing:
    export:
      otlp:
        enabled: false
