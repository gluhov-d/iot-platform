name: ${COMPOSE_PROJECT_NAME:-iot-platform}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

# Общая часть экспортёров метрик шардов (postgres-exporter-shard-*): образ, healthcheck, профиль
x-shard-exporter: &shard-exporter
  # Версия своя, не POSTGRES_EXPORTER_VERSION: v0.15.0 платформенного postgres-exporter не знает pg_stat_bgwriter PostgreSQL 17+
  image: quay.io/prometheuscommunity/postgres-exporter:${POSTGRES_SHARD_EXPORTER_VERSION}
  profiles: [observability]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # postmaster - время запуска сервера (панель Uptime), stat_replication - отставание реплик в байтах WAL (на шарде);
  # оба сборщика по умолчанию выключены
  command: ["--collector.postmaster", "--collector.stat_replication"]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:9187/metrics | grep -q '^pg_up 1'"]
    interval: 20s
    timeout: 5s
    retries: 5
    start_period: 15s
  networks: [iot-net]


services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — состояние устройств, команды, БД для Keycloak и Camunda
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION}
    profiles: [platform]
    container_name: iot-postgres
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_DBS: ${POSTGRES_EXTRA_DBS}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Redis — аренда публикатора outbox и набор опубликованных устройств
  # ---------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION}
    container_name: iot-redis
    <<: *default-restart
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # ClickHouse — хранение событий и outbox
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: iot-clickhouse
    platform: ${CLICKHOUSE_PLATFORM}
    <<: *default-restart
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # 01-schema.sh выполняется entrypoint-ом только на пустом томе
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Не просто /ping: сервис должен ждать, пока init-скрипты создадут таблицы (последняя - из 02-audit.sh)
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query \"EXISTS TABLE $${CLICKHOUSE_DB}.device_publication_audit\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Изменения схемы ClickHouse на уже инициализированном томе — одноразовая задача.
  # Те же скрипты init/clickhouse/*.sh, что entrypoint выполняет на пустом томе; все идемпотентны
  # (CREATE ... IF NOT EXISTS, ADD COLUMN IF NOT EXISTS), поэтому выполняются на каждом запуске стенда
  # ---------------------------------------------------------------------------
  clickhouse-init:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: iot-clickhouse-init
    platform: ${CLICKHOUSE_PLATFORM}
    restart: "no"
    logging: *default-logging
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./init/clickhouse:/opt/init/clickhouse:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # healthy у clickhouse наступает ещё во время init-сервера entrypoint-а, который слушает только localhost:
        # ждём, пока основной сервер начнёт принимать соединения по сети
        for _ in $$(seq 1 30); do
          clickhouse-client --host clickhouse --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" \
            --query 'SELECT 1' >/dev/null 2>&1 && break
          sleep 2
        done
        set -e
        for f in /opt/init/clickhouse/*.sh; do bash "$$f"; done
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Kafka 4.x (KRaft, без ZooKeeper) — шина событий
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: iot-kafka
    <<: *default-restart
    logging: *default-logging
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:${KAFKA_CONTROLLER_PORT}"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT},EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:${KAFKA_INTERNAL_PORT},EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KAFKA_INTERNAL_PORT} >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Инициализация топиков — одноразовая задача
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: iot-kafka-init
    restart: "no"
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:${KAFKA_INTERNAL_PORT}"
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC}
      KAFKA_DEVICES_TOPIC: ${KAFKA_DEVICES_TOPIC}
      KAFKA_DEVICES_DLT_TOPIC: ${KAFKA_DEVICES_DLT_TOPIC}
      KAFKA_EVENTS_DLT_TOPIC: ${KAFKA_EVENTS_DLT_TOPIC}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS}
      KAFKA_TOPIC_REPLICATION: ${KAFKA_TOPIC_REPLICATION}
    volumes:
      - ./init/kafka/init-topics.sh:/opt/init/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/init/init-topics.sh"]
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Schema Registry — контракты Avro
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION}
    container_name: iot-schema-registry
    <<: *default-restart
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT}"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:${SCHEMA_REGISTRY_PORT}"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # Умолчание для subject без своего режима; у subject платформы режим задаёт schema-register
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: full_transitive
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "${SCHEMA_REGISTRY_PORT}:${SCHEMA_REGISTRY_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${SCHEMA_REGISTRY_PORT}/subjects >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # events-collector-service — прием событий, ClickHouse, outbox -> devices
  # ---------------------------------------------------------------------------
  events-collector-service:
    build:
      # Контекст - корень репозитория: сборке нужны корневые файлы Gradle
      context: ..
      dockerfile: services/events-collector-service/Dockerfile
      # Gradle внутри сборки берёт avros из Nexus хоста (localhost в сборке - сам контейнер);
      # host-gateway - адрес хоста и в Docker Desktop, и в Linux
      args:
        NEXUS_URL: "http://host.docker.internal:${NEXUS_PORT}"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: iot-platform/events-collector-service:${EVENTS_COLLECTOR_IMAGE_TAG}
    <<: *default-restart
    logging: *default-logging
    depends_on:
      schema-register:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # APP_INSTANCE_ID намеренно не передается: у каждой реплики instanceId = hostname
      # контейнера (HOSTNAME), иначе при --scale все реплики логировали бы один id
      KAFKA_BOOTSTRAP_SERVERS: "kafka:${KAFKA_INTERNAL_PORT}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT}"
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC}
      KAFKA_DEVICES_TOPIC: ${KAFKA_DEVICES_TOPIC}
      KAFKA_EVENTS_DLT_TOPIC: ${KAFKA_EVENTS_DLT_TOPIC}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP}
      CLICKHOUSE_URL: "jdbc:clickhouse://clickhouse:8123"
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS}
      OUTBOX_LEASE_TTL_MS: ${OUTBOX_LEASE_TTL_MS}
      OUTBOX_PUBLISH_INTERVAL_MS: ${OUTBOX_PUBLISH_INTERVAL_MS}
      EVENTS_MAX_ATTEMPTS: ${EVENTS_MAX_ATTEMPTS}
      EVENTS_RETRY_INTERVAL: ${EVENTS_RETRY_INTERVAL}
      EVENTS_RETRY_MULTIPLIER: ${EVENTS_RETRY_MULTIPLIER}
      CLICKHOUSE_POOL_SIZE: ${CLICKHOUSE_POOL_SIZE}
      CLICKHOUSE_CONNECTION_TIMEOUT_MS: ${CLICKHOUSE_CONNECTION_TIMEOUT_MS}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT}
      KAFKA_SEND_TIMEOUT: ${KAFKA_SEND_TIMEOUT}
      KAFKA_PRODUCER_MAX_BLOCK_MS: ${KAFKA_PRODUCER_MAX_BLOCK_MS}
      KAFKA_PRODUCER_REQUEST_TIMEOUT_MS: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}
      KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
      # Alloy поднимается профилем observability; без него трейсы просто не доставляются
      MANAGEMENT_OTLP_ENDPOINT: "http://alloy:4320/v1/traces"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      # Диапазон, а не один порт: при --scale каждая реплика получает свой порт
      - "${EVENTS_COLLECTOR_PORTS}:8080"
    healthcheck:
      # В образе JRE не гарантированы curl/wget - HTTP-запрос через /dev/tcp в bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Шарды реестра устройств: PostgreSQL 18, одинаковая схема (db-migrator), данные разные.
  # Порты на хост не публикуются: приложение ходит только через ShardingSphere-Proxy,
  # db-migrator и скрипты бэкапа - по сети compose и через docker compose exec
  # ---------------------------------------------------------------------------
  postgres-shard-0:
    image: postgres:${POSTGRES_SHARD_VERSION}
    container_name: iot-postgres-shard-0
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: shard_0
      POSTGRES_USER: ${SHARD_DB_USER}
      POSTGRES_PASSWORD: ${SHARD_DB_PASSWORD}
    # hba_file: правила доступа из репозитория (роль replicator, см. config/postgres/pg_hba.conf);
    # max_slot_wal_keep_size: остановленная реплика не заполнит диск шарда - после 1 ГБ WAL слот отключается
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_slot_wal_keep_size=1GB
    volumes:
      # PostgreSQL 18: данные в /var/lib/postgresql/18/docker, том монтируется на /var/lib/postgresql
      - postgres-shard-0-data:/var/lib/postgresql
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d shard_0" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [ iot-net ]

  postgres-shard-1:
    image: postgres:${POSTGRES_SHARD_VERSION}
    container_name: iot-postgres-shard-1
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: shard_1
      POSTGRES_USER: ${SHARD_DB_USER}
      POSTGRES_PASSWORD: ${SHARD_DB_PASSWORD}
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_slot_wal_keep_size=1GB
    volumes:
      # PostgreSQL 18: данные в /var/lib/postgresql/18/docker, том монтируется на /var/lib/postgresql
      - postgres-shard-1-data:/var/lib/postgresql
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d shard_1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Подготовка шардов к репликации - одноразовая задача: роль replicator и слоты replica_N на каждом шарде.
  # Идемпотентна, безопасна на шардах с данными. Реплики стартуют после неё
  # ---------------------------------------------------------------------------
  shard-replication-init:
    image: postgres:${POSTGRES_SHARD_VERSION}
    container_name: iot-shard-replication-init
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
    environment:
      SHARD_DB_USER: ${SHARD_DB_USER}
      SHARD_DB_PASSWORD: ${SHARD_DB_PASSWORD}
      SHARD_REPLICATION_PASSWORD: ${SHARD_REPLICATION_PASSWORD}
      SHARD_EXPORTER_PASSWORD: ${SHARD_EXPORTER_PASSWORD}
    entrypoint: [ "/bin/sh", "/opt/init/shard-replication-init.sh" ]
    volumes:
      - ./init/shards/shard-replication-init.sh:/opt/init/shard-replication-init.sh:ro
    networks: [ iot-net ]

  # Реплика шарда 0: только чтение, потоковая репликация. Приложение и Proxy её не используют
  # (в конфигурации Proxy только шарды); нужна для отказоустойчивости и как источник копий. Порты на хост не публикуются
  postgres-shard-0-replica:
    image: postgres:${POSTGRES_SHARD_VERSION}
    container_name: iot-postgres-shard-0-replica
    <<: *default-restart
    logging: *default-logging
    # Пустой том принадлежит postgres: pg_basebackup и сервер работают без root
    user: postgres
    depends_on:
      shard-replication-init:
        condition: service_completed_successfully
    environment:
      # POSTGRES_USER нужен только проверке здоровья: данные и роли реплика получает от шарда
      POSTGRES_USER: ${SHARD_DB_USER}
      PRIMARY_HOST: postgres-shard-0
      REPLICATION_SLOT: replica_0
      REPLICATION_PASSWORD: ${SHARD_REPLICATION_PASSWORD}
    entrypoint: [ "/bin/sh", "/opt/init/replica-entrypoint.sh" ]
    # hot_standby_feedback: запросы на реплике (например, копия) не отменяются очисткой на шарде
    command: [ "postgres", "-c", "hot_standby=on", "-c", "hot_standby_feedback=on" ]
    volumes:
      - postgres-shard-0-replica-data:/var/lib/postgresql
      - ./init/shards/replica-entrypoint.sh:/opt/init/replica-entrypoint.sh:ro
    healthcheck:
      # healthy - сервер принимает подключения и работает как standby
      test: [ "CMD-SHELL", "[ \"$$(psql -U \"$${POSTGRES_USER}\" -d shard_0 -Atc 'SELECT pg_is_in_recovery()')\" = t ]" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [ iot-net ]

  # Реплика шарда 1: только чтение, потоковая репликация. Приложение и Proxy её не используют
  # (в конфигурации Proxy только шарды); нужна для отказоустойчивости и как источник копий. Порты на хост не публикуются
  postgres-shard-1-replica:
    image: postgres:${POSTGRES_SHARD_VERSION}
    container_name: iot-postgres-shard-1-replica
    <<: *default-restart
    logging: *default-logging
    # Пустой том принадлежит postgres: pg_basebackup и сервер работают без root
    user: postgres
    depends_on:
      shard-replication-init:
        condition: service_completed_successfully
    environment:
      # POSTGRES_USER нужен только проверке здоровья: данные и роли реплика получает от шарда
      POSTGRES_USER: ${SHARD_DB_USER}
      PRIMARY_HOST: postgres-shard-1
      REPLICATION_SLOT: replica_1
      REPLICATION_PASSWORD: ${SHARD_REPLICATION_PASSWORD}
    entrypoint: [ "/bin/sh", "/opt/init/replica-entrypoint.sh" ]
    # hot_standby_feedback: запросы на реплике (например, копия) не отменяются очисткой на шарде
    command: [ "postgres", "-c", "hot_standby=on", "-c", "hot_standby_feedback=on" ]
    volumes:
      - postgres-shard-1-replica-data:/var/lib/postgresql
      - ./init/shards/replica-entrypoint.sh:/opt/init/replica-entrypoint.sh:ro
    healthcheck:
      # healthy - сервер принимает подключения и работает как standby
      test: [ "CMD-SHELL", "[ \"$$(psql -U \"$${POSTGRES_USER}\" -d shard_1 -Atc 'SELECT pg_is_in_recovery()')\" = t ]" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [ iot-net ]

  # ---------------------------------------------------------------------------
  # Миграции Flyway на каждый шард — одноразовая задача (services/db-migrator).
  # Схема шардов меняется только здесь: сервис миграций не выполняет и адресов шардов не знает
  # ---------------------------------------------------------------------------
  db-migrator:
    build:
      context: ..
      dockerfile: services/db-migrator/Dockerfile
    image: iot-platform/db-migrator:${DB_MIGRATOR_IMAGE_TAG}
    container_name: iot-db-migrator
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      schema-register:
        condition: service_completed_successfully
    environment:
      DB_SHARDS: shard_0,shard_1
      DB_SHARD_0_URL: jdbc:postgresql://postgres-shard-0:5432/shard_0
      DB_SHARD_1_URL: jdbc:postgresql://postgres-shard-1:5432/shard_1
      DB_USER: ${SHARD_DB_USER}
      DB_PASSWORD: ${SHARD_DB_PASSWORD}
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # ShardingSphere-Proxy — логическая база devices (PostgreSQL-протокол) поверх шардов.
  # Конфигурация - шаблоны infrastructure/config/shardingsphere, пароли подставляет render-config.sh.
  # Стартует после миграций: метаданные таблиц Proxy загружает при запуске
  # ---------------------------------------------------------------------------
  shardingsphere-proxy:
    image: apache/shardingsphere-proxy:${SHARDINGSPHERE_PROXY_VERSION}
    container_name: iot-shardingsphere-proxy
    <<: *default-restart
    logging: *default-logging
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    environment:
      PORT: 3307
      # Агент метрик (Prometheus, порт 9090 контейнера, наружу не публикуется): плагин входит в образ, конфигурация - config/shardingsphere-agent
      PROXY_AGENT_ENABLED: "true"
      # Без этого start.sh в контейнере не задаёт кучу, и JVM берёт до четверти памяти Docker
      CGROUP_MEM_OPTS: "-Xms256m -Xmx512m"
      SHARD_DB_USER: ${SHARD_DB_USER}
      SHARD_DB_PASSWORD: ${SHARD_DB_PASSWORD}
      SHARDING_PROXY_USER: ${SHARDING_PROXY_USER}
      SHARDING_PROXY_PASSWORD: ${SHARDING_PROXY_PASSWORD}
    entrypoint: ["/bin/bash", "/opt/init/render-config.sh"]
    ports:
      - "${SHARDING_PROXY_PORT}:3307"
    volumes:
      - ./config/shardingsphere:/opt/init/conf:ro
      - ./config/shardingsphere/render-config.sh:/opt/init/render-config.sh:ro
      - ./config/shardingsphere-agent/agent.yaml:/opt/shardingsphere-proxy/agent/conf/agent.yaml:ro
    healthcheck:
      # Порт Proxy открывается после загрузки конфигурации и метаданных таблиц; curl/psql в образе нет
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3307"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # device-collector-service — реестр устройств: devices -> ShardingSphere-Proxy -> шарды PostgreSQL
  # ---------------------------------------------------------------------------
  device-collector-service:
    build:
      context: ..
      dockerfile: services/device-collector-service/Dockerfile
      # Gradle внутри сборки берёт avros из Nexus хоста (как у events-collector-service)
      args:
        NEXUS_URL: "http://host.docker.internal:${NEXUS_PORT}"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: iot-platform/device-collector-service:${DEVICE_COLLECTOR_IMAGE_TAG}
    <<: *default-restart
    logging: *default-logging
    depends_on:
      schema-register:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      shardingsphere-proxy:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: "kafka:${KAFKA_INTERNAL_PORT}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT}"
      KAFKA_DEVICES_TOPIC: ${KAFKA_DEVICES_TOPIC}
      KAFKA_DEVICES_DLT_TOPIC: ${KAFKA_DEVICES_DLT_TOPIC}
      DEVICES_MAX_ATTEMPTS: ${DEVICES_MAX_ATTEMPTS}
      DEVICES_RETRY_INTERVAL: ${DEVICES_RETRY_INTERVAL}
      DEVICES_RETRY_MULTIPLIER: ${DEVICES_RETRY_MULTIPLIER}
      DEVICES_MAX_FUTURE_SKEW: ${DEVICES_MAX_FUTURE_SKEW}
      DEVICES_SHARD_CACHE_TTL: ${DEVICES_SHARD_CACHE_TTL}
      DEVICES_DB_POOL_SIZE: ${DEVICES_DB_POOL_SIZE}
      DEVICES_DB_CONNECTION_TIMEOUT_MS: ${DEVICES_DB_CONNECTION_TIMEOUT_MS}
      DEVICES_DLT_MAX_BLOCK_MS: ${DEVICES_DLT_MAX_BLOCK_MS}
      DEVICES_DLT_REQUEST_TIMEOUT_MS: ${DEVICES_DLT_REQUEST_TIMEOUT_MS}
      DEVICES_DLT_DELIVERY_TIMEOUT_MS: ${DEVICES_DLT_DELIVERY_TIMEOUT_MS}
      # Только адрес Proxy: адресов шардов сервис не знает. socketTimeout - последняя граница,
      # если Proxy перестал отвечать (таймауты запросов задаёт сам шард, см. database-devices.yaml)
      DEVICES_DB_URL: "jdbc:postgresql://shardingsphere-proxy:3307/devices?connectTimeout=3&socketTimeout=15"
      DEVICES_DB_USERNAME: ${SHARDING_PROXY_USER}
      DEVICES_DB_PASSWORD: ${SHARDING_PROXY_PASSWORD}
      # Alloy поднимается профилем observability; без него трейсы просто не доставляются
      MANAGEMENT_OTLP_ENDPOINT: "http://alloy:4320/v1/traces"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      # Диапазон, а не один порт: при --scale каждая реплика получает свой порт
      - "${DEVICE_COLLECTOR_PORTS}:8080"
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\":\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [ iot-net ]

  # ---------------------------------------------------------------------------
  # Kafka UI — темы, сообщения (Avro через Schema Registry) и consumer group
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION}
    container_name: iot-kafka-ui
    profiles: [tools]
    <<: *default-restart
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: iot-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:${KAFKA_INTERNAL_PORT}"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:${SCHEMA_REGISTRY_PORT}"
      # Ключ - строка deviceId, значение - Avro: показываем его как JSON без ручного выбора в UI
      KAFKA_CLUSTERS_0_DEFAULTKEYSERDE: String
      KAFKA_CLUSTERS_0_DEFAULTVALUESERDE: SchemaRegistry
      # Конфигурация только из переменных окружения, без правки через интерфейс
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx384m"
    ports:
      - "${KAFKA_UI_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [iot-net]


  # ---------------------------------------------------------------------------
  # Nexus - Maven-репозиторий для avros (Avro-схемы платформы): из него сборка сервисов берёт схемы
  # ---------------------------------------------------------------------------
  nexus:
    image: sonatype/nexus3:${NEXUS_VERSION}
    container_name: iot-nexus
    <<: *default-restart
    logging: *default-logging
    environment:
      # По умолчанию Nexus берет до 2,7 ГБ кучи; для контрактов хватает 1 ГБ.
      # userRoot - из исходного значения переменной в образе
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1g -XX:MaxDirectMemorySize=512m -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
    ports:
      - "${NEXUS_PORT}:8081"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      # writable отвечает 200, только когда Nexus принимает запросы на запись
      test: ["CMD-SHELL", "wget -qO /dev/null -T 3 http://127.0.0.1:8081/service/rest/v1/status/writable"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Настройка Nexus - одноразовая задача: пароль admin, EULA, пользователь публикации
  # ---------------------------------------------------------------------------
  nexus-init:
    image: sonatype/nexus3:${NEXUS_VERSION}
    container_name: iot-nexus-init
    restart: "no"
    logging: *default-logging
    depends_on:
      nexus:
        condition: service_healthy
    environment:
      NEXUS_URL: http://nexus:8081
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD}
      NEXUS_PUBLISH_USER: ${NEXUS_PUBLISH_USER}
      NEXUS_PUBLISH_PASSWORD: ${NEXUS_PUBLISH_PASSWORD}
      NEXUS_ACCEPT_EULA: ${NEXUS_ACCEPT_EULA}
    volumes:
      # Только чтение: нужен сгенерированный при первом старте /nexus-data/admin.password
      - nexus-data:/nexus-data:ro
      - ./init/nexus/init-nexus.sh:/opt/init/init-nexus.sh:ro
    entrypoint: ["/bin/sh", "/opt/init/init-nexus.sh"]
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Публикация avros - одноразовая задача: собирает Avro-схемы платформы (avros/) и кладёт версию
  # в Nexus. Версия уже в Nexus с теми же схемами - пропускает; с другими схемами - ошибка.
  # Сервисы собираются только после неё: их сборка берёт avros из Nexus с явной версией
  # ---------------------------------------------------------------------------
  avros-publish:
    build:
      context: ..
      dockerfile: avros/Dockerfile
    image: iot-platform/avros-publish:${AVROS_IMAGE_TAG}
    container_name: iot-avros-publish
    restart: "no"
    logging: *default-logging
    depends_on:
      nexus-init:
        condition: service_completed_successfully
    environment:
      NEXUS_URL: http://nexus:8081
      NEXUS_PUBLISH_USER: ${NEXUS_PUBLISH_USER}
      NEXUS_PUBLISH_PASSWORD: ${NEXUS_PUBLISH_PASSWORD}
    networks: [ iot-net ]

  # ---------------------------------------------------------------------------
  # Регистрация схем avros в Schema Registry - одноразовая задача после публикации в Nexus.
  # Subject <тема>-value, режим FULL_TRANSITIVE; повторный запуск ничего не меняет, несовместимая схема -
  # ошибка. Сервисы работают с auto.register.schemas=false: незарегистрированную схему они не запишут
  # ---------------------------------------------------------------------------
  schema-register:
    build:
      context: ..
      dockerfile: avros/Dockerfile
    # Тот же образ, что у avros-publish (схемы и кеш Gradle), другая точка входа
    image: iot-platform/avros-publish:${AVROS_IMAGE_TAG}
    container_name: iot-schema-register
    restart: "no"
    logging: *default-logging
    depends_on:
      avros-publish:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT}"
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC}
      KAFKA_DEVICES_TOPIC: ${KAFKA_DEVICES_TOPIC}
      KAFKA_EVENTS_DLT_TOPIC: ${KAFKA_EVENTS_DLT_TOPIC}
      KAFKA_DEVICES_DLT_TOPIC: ${KAFKA_DEVICES_DLT_TOPIC}
      SCHEMA_COMPATIBILITY: FULL_TRANSITIVE
    entrypoint: [ "/workspace/avros/scripts/container-register.sh" ]
    networks: [ iot-net ]

  # ---------------------------------------------------------------------------
  # MinIO — объектное хранилище (DLT + вложения)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:${MINIO_VERSION}
    container_name: iot-minio
    profiles: [platform]
    <<: *default-restart
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Создание бакетов — одноразовая задача
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/minio:${MINIO_VERSION}
    container_name: iot-minio-init
    profiles: [platform]
    restart: "no"
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKETS: ${MINIO_BUCKETS}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        for b in $$(echo "$${MINIO_BUCKETS}" | tr ',' ' '); do
          echo "==> creating bucket $$b"
          mc mb --ignore-existing "local/$$b"
        done
        mc ls local
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Keycloak — аутентификация и авторизация
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    profiles: [platform]
    platform: ${KEYCLOAK_PLATFORM}
    container_name: iot-keycloak
    <<: *default-restart
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start-dev", "--http-port=8080", "--health-enabled=true", "--metrics-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}"
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # В образе нет curl — используем /dev/tcp из bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Camunda — оркестрация бизнес-процессов
  # ---------------------------------------------------------------------------
  camunda:
    image: camunda/camunda-bpm-platform:${CAMUNDA_VERSION}
    container_name: iot-camunda
    profiles: [platform]
    <<: *default-restart
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: "jdbc:postgresql://postgres:5432/${CAMUNDA_DB}"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_VALIDATE_ON_BORROW: "true"
      WAIT_FOR: "postgres:5432"
      JAVA_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "${CAMUNDA_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/engine-rest/engine || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # postgres-exporter — метрики PostgreSQL для Prometheus
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION}
    container_name: iot-postgres-exporter
    profiles: [platform]
    <<: *default-restart
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    # postmaster collector в v0.15.0 выключен по умолчанию, а на нём
    # держится панель Uptime (pg_postmaster_start_time_seconds)
    command: ["--collector.postmaster"]
    environment:
      # Логин и пароль отдельно от URI: экспортёр сам экранирует их при сборке DSN,
      # поэтому спецсимволы в пароле (#, @, /, ?) не ломают адрес.
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:9187/metrics | grep -q '^pg_up 1'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Экспортёры метрик шардов и их реплик: по одному postgres-exporter на каждый сервер PostgreSQL
  # (профиль observability). Под ролью exporter (pg_monitor), создаёт её shard-replication-init.
  # Порты на хост не публикуются: метрики читает Prometheus по сети compose
  # ---------------------------------------------------------------------------
  postgres-exporter-shard-0:
    <<: *shard-exporter
    container_name: iot-postgres-exporter-shard-0
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      shard-replication-init:
        condition: service_completed_successfully
    environment:
      DATA_SOURCE_URI: "postgres-shard-0:5432/shard_0?sslmode=disable"
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${SHARD_EXPORTER_PASSWORD}

  postgres-exporter-shard-0-replica:
    <<: *shard-exporter
    container_name: iot-postgres-exporter-shard-0-replica
    depends_on:
      postgres-shard-0-replica:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: "postgres-shard-0-replica:5432/shard_0?sslmode=disable"
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${SHARD_EXPORTER_PASSWORD}

  postgres-exporter-shard-1:
    <<: *shard-exporter
    container_name: iot-postgres-exporter-shard-1
    depends_on:
      postgres-shard-1:
        condition: service_healthy
      shard-replication-init:
        condition: service_completed_successfully
    environment:
      DATA_SOURCE_URI: "postgres-shard-1:5432/shard_1?sslmode=disable"
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${SHARD_EXPORTER_PASSWORD}

  postgres-exporter-shard-1-replica:
    <<: *shard-exporter
    container_name: iot-postgres-exporter-shard-1-replica
    depends_on:
      postgres-shard-1-replica:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: "postgres-shard-1-replica:5432/shard_1?sslmode=disable"
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${SHARD_EXPORTER_PASSWORD}

  # ---------------------------------------------------------------------------
  # kafka-exporter — метрики Kafka (лаг консьюмер-групп) для Prometheus
  # ---------------------------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_VERSION}
    container_name: iot-kafka-exporter
    profiles: [observability]
    <<: *default-restart
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:${KAFKA_INTERNAL_PORT}", "--kafka.version=3.9.0", "--web.listen-address=:9308"]
    ports:
      - "${KAFKA_EXPORTER_PORT}:9308"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:9308/metrics | grep -q '^kafka_brokers [1-9]'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Prometheus — сбор метрик
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: iot-prometheus
    profiles: [observability]
    <<: *default-restart
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Loki — хранение логов
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: iot-loki
    profiles: [observability]
    <<: *default-restart
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    user: "0"
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Tempo — хранение трейсов (OTLP)
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:${TEMPO_VERSION}
    container_name: iot-tempo
    profiles: [observability]
    <<: *default-restart
    logging: *default-logging
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"
    ports:
      - "${TEMPO_HTTP_PORT}:3200"
      - "${TEMPO_OTLP_GRPC_PORT}:4317"
      - "${TEMPO_OTLP_HTTP_PORT}:4318"
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Grafana Alloy — сбор логов контейнеров и приём OTLP
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    container_name: iot-alloy
    profiles: [observability]
    <<: *default-restart
    logging: *default-logging
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    environment:
      # Имя Compose-проекта: Alloy собирает логи только его контейнеров
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-iot-platform}
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    user: "0"
    ports:
      - "${ALLOY_PORT}:12345"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      # В образе alloy нет curl/wget — проверяем через /dev/tcp в bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345; printf 'GET /-/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200 OK'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [iot-net]

  # ---------------------------------------------------------------------------
  # Grafana — дашборды (Kafka, PostgreSQL) поверх Prometheus/Loki/Tempo
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: iot-grafana
    profiles: [observability]
    <<: *default-restart
    logging: *default-logging
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceQLEditor
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [iot-net]

networks:
  iot-net:
    name: iot-net
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  kafka-data:
  minio-data:
  keycloak-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
  nexus-data:
  postgres-shard-0-data:
  postgres-shard-1-data:
  postgres-shard-0-replica-data:
  postgres-shard-1-replica-data:
