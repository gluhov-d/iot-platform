global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: iot-platform
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # events-collector-service: DNS Docker возвращает все реплики сервиса,
  # поэтому при --scale каждая реплика скрейпится отдельно
  - job_name: events-collector-service
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    dns_sd_configs:
      - names: ["events-collector-service"]
        type: A
        port: 8080
        refresh_interval: 15s
    # Prometheus Java client 1.x запрещает имена с суффиксом _created (зарезервирован
    # OpenMetrics), поэтому счетчик outbox.candidate.created экспортируется как
    # outbox_candidate_total. Возвращаем требуемое имя при скрейпе
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: outbox_candidate_total
        target_label: __name__
        replacement: outbox_candidate_created_total

  # device-collector-service: так же, все реплики через DNS Docker
  - job_name: device-collector-service
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    dns_sd_configs:
      - names: [ "device-collector-service" ]
        type: A
        port: 8080
        refresh_interval: 15s

  # ShardingSphere-Proxy: агент метрик (config/shardingsphere-agent), порт 9090 контейнера
  - job_name: shardingsphere-proxy
    static_configs:
      - targets: [ "shardingsphere-proxy:9090" ]
        labels:
          instance: iot-shardingsphere-proxy

  # Шарды реестра устройств и их реплики: по одному postgres-exporter на каждый сервер PostgreSQL.
  # Метки shard (shard_0, shard_1) и role (primary, replica) нужны панелям Grafana
  - job_name: postgres-shards
    static_configs:
      - targets: [ "postgres-exporter-shard-0:9187" ]
        labels: { instance: iot-postgres-shard-0, shard: shard_0, role: primary }
      - targets: [ "postgres-exporter-shard-0-replica:9187" ]
        labels: { instance: iot-postgres-shard-0-replica, shard: shard_0, role: replica }
      - targets: [ "postgres-exporter-shard-1:9187" ]
        labels: { instance: iot-postgres-shard-1, shard: shard_1, role: primary }
      - targets: [ "postgres-exporter-shard-1-replica:9187" ]
        labels: { instance: iot-postgres-shard-1-replica, shard: shard_1, role: replica }

  - job_name: postgres
    static_configs:
      - targets: [ "postgres-exporter:9187" ]
        labels:
          instance: iot-postgres

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          instance: iot-kafka

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
