server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

# Значения подставляются из окружения контейнера (-config.expand-env=true); значений по умолчанию нет.
compactor:
  compaction:
    # Срок хранения блоков; срок бакета в ILM больше (21 суток против 14): система удаляет первой
    block_retention: ${TEMPO_BLOCK_RETENTION}

# Блоки - в бакете MinIO tempo-traces (учётка видит только его, ADR-0015); локальный том - WAL
storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      bucket: ${MINIO_BUCKET_TEMPO}
      endpoint: minio:9000
      access_key: ${TEMPO_S3_ACCESS_KEY}
      secret_key: ${TEMPO_S3_SECRET_KEY}
      insecure: true
      forcepathstyle: true

usage_report:
  reporting_enabled: false
