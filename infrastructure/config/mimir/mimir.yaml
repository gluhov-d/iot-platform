# Mimir - хранилище метрик (ADR-0016): монолит (-target=all), один узел, блоки в MinIO.
# Значения подставляются из окружения контейнера (-config.expand-env=true); значений по умолчанию нет.
# Alertmanager не включается: алертов нет, -target=all его не содержит.
multitenancy_enabled: false

server:
  http_listen_port: ${MIMIR_PORT}
  grpc_listen_port: 9095
  log_level: warn

# Один узел: кольца в памяти, без репликации
ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory

store_gateway:
  sharding_ring:
    replication_factor: 1

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: inmemory

distributor:
  ring:
    kvstore:
      store: inmemory

# Хранилище S3 - бакет mimir-blocks. Учётка видит только его (ADR-0015).
# Blocks и ruler лежат в разных префиксах: объекты в корне бакета Mimir принимает за тенантов (research.md R13).
common:
  storage:
    backend: s3
    s3:
      endpoint: minio:9000
      insecure: true
      bucket_name: ${MINIO_BUCKET_MIMIR}
      access_key_id: ${MIMIR_S3_ACCESS_KEY}
      secret_access_key: ${MIMIR_S3_SECRET_KEY}

blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync

ruler_storage:
  storage_prefix: ruler

# Правила и алерты не используются; каталог ruler нужен только для запуска монолита
ruler:
  rule_path: /data/ruler

limits:
  # Срок хранения блоков; срок бакета в ILM больше (380 суток против 365): система удаляет первой
  compactor_blocks_retention_period: ${MIMIR_RETENTION_PERIOD}

usage_stats:
  enabled: false
