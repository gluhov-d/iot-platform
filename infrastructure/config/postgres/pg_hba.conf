# Правила доступа шардов PostgreSQL. Подключается как hba_file (command в docker-compose.yaml),
# поэтому действует и на уже созданных томах, где pg_hba.conf лежит внутри данных.
#
# Как в образе postgres по умолчанию - всё, кроме двух строк про роль replicator:
#   - потоковую репликацию (pg_basebackup и приёмник WAL реплики) принимает только replicator с паролем;
#   - обычные подключения к базам для replicator закрыты: у роли есть право REPLICATION, но не данные.
# Строки идут по порядку: PostgreSQL берёт первое подходящее правило.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     replicator      all                     scram-sha-256
host    all             replicator      all                     reject
host    all             all             all                     scram-sha-256